<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data: https: http:"
    />

    <!-- no title, no text of any kind: the frame carries pills and nothing else (§4.2) -->

    <link rel="stylesheet" href="/css/chrome.css" />
    <!-- the controls' icons: the same set the UI page uses -->
    <link rel="stylesheet" href="/ext/icons/iconfont.css" />
  </head>

  <body class="chrome ct-closed">
    <div id="frame"><div id="strip"></div></div>

    <!-- the strip is re-parented in here while the island is open (§4.4), before the
         address pill, so the row reads [tab pills] [address pill] [controls]. -->
    <div id="island">
      <div id="address">
        <img id="address-favicon" alt="" />
        <input id="address-input" readonly autocomplete="off" spellcheck="false" />
      </div>

      <!-- the row's third element (§4.4): history, the menu, then the window buttons.
           data-label is the locale's hook - it sets the tooltip and the accessible
           name from that key, and an unknown key throws - so these are real keys.
           data-state is this page's own: which of the two the button is. -->
      <div id="controls">
        <button id="back-button" type="button" data-label="goBack" data-state="back" data-action="goBack" disabled>
          <i class="i carbon:chevron-left"></i>
        </button>
        <button id="forward-button" type="button" data-label="goForward" data-state="forward" data-action="goForward" disabled>
          <i class="i carbon:chevron-right"></i>
        </button>
        <button id="reload-button" type="button" data-label="tabMenuReload" data-state="reload" data-action="reload">
          <i class="i carbon:restart"></i>
        </button>
        <button id="menu-button" type="button" data-label="openMenu" data-state="menu" data-action="openMenu">
          <i class="i carbon:overflow-menu-vertical"></i>
        </button>
        <span class="window-controls">
          <!-- The conventional glyphs, the ones the old caption buttons used: a bar,
               a square, two overlapping squares, a cross. Drawn rather than taken
               from the icon font, because the icon font's minimize is a diagonal
               collapse arrow and no other window on the desktop has that. -->
          <button id="minimize-button" type="button" data-label="appMenuMinimize" data-state="minimize" data-action="minimize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><line x1="1" y1="5.5" x2="11" y2="5.5" /></svg>
          </button>
          <button id="maximize-button" type="button" data-label="appMenuZoomIn" data-state="maximize" data-action="maximize">
            <svg class="maximize-glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" /></svg>
            <svg class="restore-glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="3.5" width="7" height="7" /><polyline points="3.5,3.5 3.5,1.5 10.5,1.5 10.5,8.5 8.5,8.5" /></svg>
          </button>
          <button id="close-button" type="button" data-label="appMenuClose" data-state="close" data-action="close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1,1 l 10,10 M1,11 l 10,-10" /></svg>
          </button>
        </span>
      </div>
    </div>

    <script src="/dist/chrome.js"></script>
  </body>
</html>
