name: Build Package

# Manual only. The push and pull-request path is ci.yml, which builds and verifies
# the .deb on every run. This workflow exists to produce the release artifacts for
# the three formats Mercury v0.1 ships.
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run buildDebian
            artifact: linux-deb-package
            path: dist/app/*.deb
          - os: ubuntu-latest
            cmd: npm run buildRedhat
            artifact: linux-rpm-package
            path: dist/app/*.rpm
          - os: ubuntu-latest
            cmd: npm run buildAppImage
            artifact: linux-appimage-package
            path: dist/app/*.AppImage
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install --omit=optional
    - name: build package
      run: ${{ matrix.cmd }}
    - name: upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.path }}
        # Artifacts are re-derivable from the workflow, so they are not kept
        # indefinitely. This repository is public and does not pay for them, but
        # the habit is worth keeping.
        retention-days: 14

  # The platform-later path, kept so the configuration is not rebuilt from scratch
  # when Windows and macOS are picked up. It does not run, and it would not work if
  # it did: both scripts still name Min's artifacts (`Min.app`,
  # `Min-v<version>-windows.zip`, `min-<version>-setup.exe`) and they still carry
  # Min's names throughout, while `productName: 'Mercury'` means electron-builder
  # now emits `Mercury.app`. Fixing them is part of that milestone, not SP0 - see
  # the ledger's deferred section for the full list.
  platform-later:
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run buildWindows
            artifact: windows-package
            path: |
              dist/app/*.zip
              dist/app/*.exe
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacIntel
            artifact: darwin-x86-package
            path: dist/app/*.zip
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacArm
            artifact: darwin-arm-package
            path: dist/app/*.zip
    env:
      SDKROOT: ${{ matrix.env.SDKROOT }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install --omit=optional
    - name: build package
      run: ${{ matrix.cmd }}
    - name: upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.path }}
